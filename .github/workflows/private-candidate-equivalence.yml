name: Sanitized private candidate equivalence diagnostics

on:
  push:
    branches:
      - diagnostic/private-candidate-equivalent

permissions:
  contents: read

jobs:
  full-backend-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run clean backend suite up to 20 times, stop on first failure
        run: python3 scripts/diagnostics/run_full_suite_order.py --runs 20
      - name: Upload full-suite cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-private-candidate-full-suite
          path: build/full-suite-order-evidence/
          if-no-files-found: warn
          retention-days: 14

  stress-200:
    needs: full-backend-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Repeat the original 3-send stress case 200 times
        run: python3 scripts/diagnostics/run_stress_repeat.py --runs 200
      - name: Upload stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-private-candidate-stress-200
          path: build/private-candidate-evidence/stress-repeat/
          if-no-files-found: warn
          retention-days: 14

  startup-gate-to-stress-100:
    needs: stress-200
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Repeat production startup-gate class then stress in one test JVM
        run: python3 scripts/diagnostics/run_context_stress_order.py --runs 100
      - name: Upload cross-test lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-private-candidate-context-stress-100
          path: build/private-candidate-evidence/context-stress-order/
          if-no-files-found: warn
          retention-days: 14
